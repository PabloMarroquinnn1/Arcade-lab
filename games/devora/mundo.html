<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Devora Mundo Compartido | Arcade Lab</title>
  <link rel="stylesheet" href="style.css?v=1">
</head>
<body>
  <div id="app">
    <header id="hud">
      <div class="hud-left">
        <a href="/" class="badge back-link">&#8592; Arcade</a>
        <a href="index.html" class="badge back-link">Cambiar modo</a>
      </div>
      <div class="hud-right">
        <span class="score-tag score">Tamaño <span id="score">0</span></span>
      </div>
    </header>

    <main id="stage">
      <div id="entryScreen" class="menu-body" style="min-height:auto;padding:0">
        <div class="menu" style="max-width:320px">
          <p class="menu-sub" style="margin-bottom:16px">Elegí un nombre para entrar al mundo compartido</p>
          <div style="display:flex;flex-direction:column;gap:10px">
            <input id="nombreInput" type="text" placeholder="Tu nombre" maxlength="20"
              style="font:inherit;padding:12px;text-align:center;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.15);border-radius:8px;color:#fff" />
            <button class="badge" id="entrarBtn" type="button" style="cursor:pointer;color:#00ff88;border-color:rgba(0,255,136,0.4)">Entrar</button>
          </div>
        </div>
      </div>
      <div id="gameWrap" style="display:none;position:relative">
        <canvas id="gameCanvas"></canvas>
        <div id="leaderboard" class="leaderboard"></div>
      </div>
    </main>

    <footer id="controls">
      <span>Movete con el mouse, el dedo o el lápiz. Comé lo chico, esquivá lo grande.</span>
    </footer>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="mundo.js?v=1"></script>
</body>
</html>
