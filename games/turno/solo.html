<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Turno Solo | Arcade Lab</title>
  <link rel="stylesheet" href="style.css?v=1">
</head>
<body>
  <div id="app">
    <header id="hud">
      <div class="hud-left">
        <a href="/" class="badge back-link">&#8592; Arcade</a>
        <a href="index.html" class="badge back-link">Cambiar modo</a>
      </div>
      <div class="hud-center">
        <span id="turnBadge" class="score-tag turn">Tu turno</span>
      </div>
      <div class="hud-right">
        <span class="score-tag best">Partidas ganadas <span id="wins">0</span></span>
      </div>
    </header>

    <main id="stage">
      <div class="opponents-row" id="opponentsRow"></div>

      <div class="table-row">
        <div class="card back" id="deckPile">🂠</div>
        <div id="discardPile"></div>
      </div>

      <div class="hand-row" id="handRow"></div>

      <button class="primary-btn" id="drawBtn" type="button" style="display:none">Robar carta</button>
    </main>

    <footer id="controls">
      <span>Hacé click en una carta para jugarla. Si ninguna te sirve, robás del mazo.</span>
    </footer>

    <div id="colorOverlay" class="overlay-message">
      <div class="overlay-card">
        <div class="overlay-title">Elegí un color</div>
        <div class="color-picker" id="colorPicker">
          <div class="color-swatch rojo" data-color="rojo"></div>
          <div class="color-swatch verde" data-color="verde"></div>
          <div class="color-swatch azul" data-color="azul"></div>
          <div class="color-swatch amarillo" data-color="amarillo"></div>
        </div>
      </div>
    </div>

    <div id="overlay" class="overlay-message">
      <div class="overlay-card">
        <div id="overlayTitle" class="overlay-title"></div>
        <p id="overlaySub" class="overlay-sub"></p>
        <button class="primary-btn" id="retryBtn" type="button">Jugar de nuevo</button>
      </div>
    </div>
  </div>

  <script src="solo.js?v=1"></script>
</body>
</html>
